services:
  db:
    image: postgres:16-alpine

    environment:
      POSTGRES_DB: bewerbung_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test

    ports:
      - "5433:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U test -d bewerbung_test",
        ]
      interval: 2s
      timeout: 5s
      retries: 20


  api:
    image: bewerbungmanager-api:e2e

    build:
      context: .
      dockerfile: Dockerfile

    depends_on:
      db:
        condition: service_healthy

    environment:
      DATABASE_URL: postgresql://test:test@db:5432/bewerbung_test
      NODE_ENV: test
      PORT: 3000

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_GMAIL_REDIRECT_URI: ${GOOGLE_GMAIL_REDIRECT_URI}
      JWT_SECRET: ${JWT_SECRET}

    ports:
      - "3000:3000"

    command: >
      sh -c "
      npx prisma db push --skip-generate &&
      npm start
      "