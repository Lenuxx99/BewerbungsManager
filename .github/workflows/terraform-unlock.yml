name: Terraform Force Unlock

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  unlock:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/infra

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.TERRAFROM_AWS_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Force Unlock
        run: terraform force-unlock -force ee2fe507-9d55-12b4-85d7-5d65f83eb38c