name: API Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


permissions:
  contents: read
  id-token: write


jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api-service


    steps:
      # Repository auf den GitHub Runner laden
      - name: Checkout repository
        uses: actions/checkout@v6


      # Node.js installieren
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.22.0"
          cache: "npm"
          cache-dependency-path: api-service/package-lock.json


      # npm Dependencies installieren
      - name: Install dependencies
        run: npm ci


      # Prüfen, ob Docker auf dem Runner verfügbar ist
      - name: Check Docker
        run: docker version


      # Prisma Client erzeugen
      - name: Generate Prisma Client
        run: npx prisma generate


      # Unit Tests
      - name: Run unit tests
        run: npm run test:unit


      # Integration Tests
      #
      # Diese verwenden die Testcontainers-Testdatenbank.
      - name: Run integration tests
        run: npm run test:integration


      # ---------------------------------------------------
      # E2E
      # ---------------------------------------------------

      # Baut das API-Image aus dem echten Dockerfile
      # und startet:
      #
      # PostgreSQL
      # +
      # API
      #
      # Die Werte hier sind Testwerte.
      # E2E-Tests rufen Google nicht auf, daher werden keine echten Google-Secrets benötigt.
      # Falls später echte Secrets benötigt werden, können diese als GitHub Secrets hinterlegt werden.
      - name: Start E2E environment
        env:
          JWT_SECRET: secret
          GOOGLE_CLIENT_ID: e2e-test-client-id
          GOOGLE_CLIENT_SECRET: e2e-test-client-secret
          GOOGLE_GMAIL_REDIRECT_URI: http://localhost:3000/api/gmail/callback
        run: |
          docker compose -f docker-compose.e2e.yml up -d --build


      # Warten bis die API wirklich gestartet ist.
      #
      # /api/user/me darf 401 zurückgeben.
      # Wichtig ist nur, dass der HTTP-Server erreichbar ist.
      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl --silent --output /dev/null http://localhost:3000/api/user/me; then
              echo "API is ready"
              exit 0
            fi

            echo "Waiting for API..."
            sleep 2
          done

          echo "API failed to start"

          docker compose -f docker-compose.e2e.yml logs

          exit 1


      # Echte HTTP E2E Tests gegen den Docker-Container
      - name: Run E2E tests
        run: npm run test:e2e


      # Container immer stoppen.
      #
      # always() ist wichtig:
      # Auch wenn ein E2E Test fehlschlägt,
      # sollen DB und API Container entfernt werden.
      - name: Stop E2E environment
        if: always()
        run: |
          docker compose -f docker-compose.e2e.yml down -v


      # ---------------------------------------------------
      # IMAGE PUBLISH
      # ---------------------------------------------------

      # Nur bei einem Push auf main.
      #
      # Bei Pull Requests wird kein Image veröffentlicht.
      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-north-1


      # Login bei Amazon ECR.
      #
      # Die AWS-Credentials stammen aus der zuvor
      # übernommenen IAM Role via GitHub OIDC.
      - name: Log in to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # Das bereits getestete Image bekommt zwei ECR Tags.
      - name: Tag API image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: bewerbungmanager-api
        run: |
          docker tag bewerbungmanager-api:e2e \
            $ECR_REGISTRY/$ECR_REPOSITORY:latest

          docker tag bewerbungmanager-api:e2e \
            $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}


      # Genau das Image pushen,
      # das vorher bei den E2E Tests gelaufen ist.
      - name: Push API image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: bewerbungmanager-api
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}